name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check-build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SANITY_PROJECT_ID: e497m7tn
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
